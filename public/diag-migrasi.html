<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Diagnostik Migrasi — QA SIBISKuMer</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; line-height: 1.5; color: #111; }
  pre { background: #f3f4f6; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
  button { padding: 10px 16px; font-size: 15px; border-radius: 8px; border: 1px solid #999; background: #fff; cursor: pointer; }
</style>
</head>
<body>
<h1>Diagnostik Migrasi (QA)</h1>
<p>Halaman ini hanya MEMBACA prasyarat penawaran migrasi S4 pada profil browser ini. Jalankan setelah masuk mode server.</p>
<button id="cek">Periksa Sekarang</button>
<pre id="hasil">Belum diperiksa.</pre>
<script>
  const hasil = document.getElementById('hasil');
  function hitungStore(namaDb, namaStore) {
    return new Promise((resolve) => {
      const req = indexedDB.open(namaDb);
      req.onerror = () => resolve('gagal-buka');
      req.onsuccess = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(namaStore)) { db.close(); resolve('store-tidak-ada'); return; }
        const tx = db.transaction(namaStore, 'readonly');
        const c = tx.objectStore(namaStore).count();
        c.onsuccess = () => { const v = c.result; db.close(); resolve(v); };
        c.onerror = () => { db.close(); resolve('gagal-hitung'); };
      };
    });
  }
  document.getElementById('cek').addEventListener('click', async () => {
    const baris = [];
    baris.push('modeUtama (LS bukuinduk_mode_utama) = ' + localStorage.getItem('bukuinduk_mode_utama'));
    baris.push('penanda migrasi (LS bukuinduk_migrasi_server) = ' + localStorage.getItem('bukuinduk_migrasi_server'));
    baris.push('diagnostik effect (LS bukuinduk_migrasi_diag) = ' + localStorage.getItem('bukuinduk_migrasi_diag'));
    const dbs = (await indexedDB.databases()).map((d) => d.name);
    baris.push('IndexedDB terdaftar = ' + JSON.stringify(dbs));
    baris.push('siswa di BukuInduk_Merdeka_DB = ' + (await hitungStore('BukuInduk_Merdeka_DB', 'siswa')));
    baris.push('users di BukuInduk_Merdeka_DB = ' + (await hitungStore('BukuInduk_Merdeka_DB', 'users')));
    try {
      const r = await fetch('/api/v1/auth/sesi', { credentials: 'same-origin' });
      const j = await r.json();
      baris.push('GET /api/v1/auth/sesi -> HTTP ' + r.status + ' benihAwal = ' + (j && j.data ? String(j.data.benihAwal) : '(tidak ada)'));
    } catch (e) {
      baris.push('GET /api/v1/auth/sesi -> GAGAL: ' + e.message);
    }
    hasil.textContent = baris.join('\n');
  });
</script>
</body>
</html>
